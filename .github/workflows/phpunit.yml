name: PHP quality gate (GrumPHP)

# Uruchamia na kazdy push/PR ten sam zestaw sprawdzen co lokalny pre-commit
# hook GrumPHP (PHPStan, PHPUnit, PHP-CS-Fixer) - zeby zielone testy lokalnie
# u jednej osoby nie byly jedynym zabezpieczeniem przed regresja.
# Nazwa pliku (phpunit.yml) zostala, bo auto-merge-to-master.yml odwoluje sie
# do niej po sciezce (workflow_call).

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_call: {} # pozwala wywolac ten workflow z auto-merge-to-master.yml

jobs:
  grumphp:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # 8.1 is composer.json's declared floor ("php": ">=8.1"); 8.4 matches
        # the Dockerfile's base image (mafio69/php-env:8.4-fpm-alpine), i.e.
        # what actually runs in production. Testing only 8.4 would let the
        # ">=8.1" claim go unverified.
        php-version: ["8.1", "8.4"]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: ctype, iconv, simplexml, pdo, pdo_sqlite, sqlite3, ssh2
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-${{ matrix.php-version }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php-version }}-

      - name: Zainstaluj zaleznosci
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Uruchom GrumPHP (PHPStan + PHPUnit + PHP-CS-Fixer)
        run: vendor/bin/grumphp run
