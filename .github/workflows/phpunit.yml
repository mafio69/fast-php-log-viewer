name: PHP quality gate (GrumPHP)

# Uruchamia na kazdy push/PR ten sam zestaw sprawdzen co lokalny pre-commit
# hook GrumPHP (PHPStan, PHPUnit, PHP-CS-Fixer) - zeby zielone testy lokalnie
# u jednej osoby nie byly jedynym zabezpieczeniem przed regresja.
# Nazwa pliku (phpunit.yml) zostala, bo auto-merge-to-master.yml odwoluje sie
# do niej po sciezce (workflow_call).

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_call: {} # pozwala wywolac ten workflow z auto-merge-to-master.yml

jobs:
  grumphp:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # composer.json declares "php": ">=8.1", but composer.lock's dev
          # tooling doesn't actually support that floor: grumphp v2.23 needs
          # ~8.2-8.5, and several locked symfony/* packages need >=8.4.1. 8.4
          # is what the Dockerfile's base image runs in production, and the
          # only version this repo's own lock file can currently install on.
          php-version: "8.5"
          extensions: ctype, iconv, simplexml, pdo, pdo_sqlite, sqlite3, ssh2
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Zainstaluj zaleznosci
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Uruchom GrumPHP (PHPStan + PHPUnit + PHP-CS-Fixer)
        run: vendor/bin/grumphp run
